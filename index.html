<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>World Noise</title>
  <meta name="description" content="Listen to live radio from anywhere in the world." />
  <!-- Install as an app (iPhone: Safari → Share → Add to Home Screen) -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="World Noise" />
  <meta name="theme-color" content="#0f1216" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>World <span>Noise</span></h1>
      <button id="random-btn" class="icon-btn" aria-label="Play a random station" title="Surprise me">🎲</button>
    </header>

    <div class="where">
      <select id="country" aria-label="Country"><option value="">🌍 Whole world</option></select>
      <select id="state" aria-label="Region" hidden><option value="">All regions</option></select>
    </div>

    <div class="tools">
      <input id="search" type="search" placeholder="Search stations" autocomplete="off" />
      <button id="near-btn" class="chip" title="Stations near you">📍 Near me</button>
      <button id="fav-filter" class="chip" aria-pressed="false">★</button>
    </div>

    <p id="status" class="status" aria-live="polite">Loading stations…</p>
    <ul id="list" class="list"></ul>
  </main>

  <footer id="player" class="player idle" aria-label="Player">
    <span id="np-logo" class="logo"><img alt="" referrerpolicy="no-referrer" hidden /></span>
    <div class="np-text">
      <span id="np-name" class="np-name">Pick a station</span>
      <span id="np-meta" class="np-meta">Choose a place above, then tap a station</span>
    </div>
    <button id="fav-btn" class="icon-btn" aria-label="Add to favorites" disabled>☆</button>
    <button id="play-btn" class="play-btn" aria-label="Play" disabled>▶</button>
  </footer>

  <audio id="audio" preload="none"></audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
